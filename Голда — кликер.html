#top{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:44%;min-width:150px;background:var(--panel);border-radius:18px;padding:8px 10px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#top small{font-size:13px;opacity:.85}
#bal{display:flex;gap:10px;align-items:center;justify-content:center;font-size:32px;font-weight:700}
.cash{width:46px;height:26px;background:linear-gradient(180deg,#fff3b0 0%,#ffd54f 35%,#f2a900 70%,#b87400 100%);clip-path:polygon(16% 0,84% 0,100% 100%,0 100%);position:relative;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.cash:after{content:"";position:absolute;left:22%;right:22%;top:18%;height:28%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);border-radius:3px}
.side{position:absolute;left:12px;display:flex;flex-direction:column;gap:12px;top:calc(18px + env(safe-area-inset-top,0px))}
.side button{width:52px;height:52px;border-radius:50%;border:3px solid #8a4b00;background:radial-gradient(circle at 35% 30%,#ffd54f,#f57c00);font-size:24px;box-shadow:0 3px 8px rgba(0,0,0,.4);color:#4e2600}
.side button:active{transform:scale(.92)}
#hero{position:absolute;left:50%;bottom:27%;width:58%;max-width:280px;transform:translateX(-50%);cursor:pointer;-webkit-mask-image:linear-gradient(#000 78%,transparent 100%);mask-image:linear-gradient(#000 78%,transparent 100%);transform-origin:50% 100%;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
#hero.hit{animation:sq .18s ease-out}
@keyframes sq{0%{transform:translateX(-50%) scale(1)}35%{transform:translateX(-50%) scale(1.08,.9)}100%{transform:translateX(-50%) scale(1)}}
.fl{position:absolute;pointer-events:none;font-weight:800;font-size:24px;color:#ffe082;text-shadow:0 2px 3px #000;animation:up .9s ease-out forwards}
@keyframes up{to{transform:translateY(-110px);opacity:0}}
.bub{position:absolute;bottom:-20px;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-110vh);opacity:0}}
#shop{position:absolute;left:5%;right:5%;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--panel);border-radius:22px;padding:14px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#shop p{margin:0 0 8px;font-size:15px}
#up{width:90%;padding:14px 8px;border:0;border-radius:16px;background:var(--gold);color:#3e2400;font-size:17px;font-weight:800;box-shadow:0 4px 0 #b57700}
#up:active{transform:translateY(3px);box-shadow:0 1px 0 #b57700}
#up:disabled{opacity:.55}
#up span{font-weight:600;font-size:13px}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:5}
#modal.on{display:grid}
#box{background:#3b2417;border-radius:20px;padding:20px;width:84%;text-align:center;line-height:1.6}
#box button{margin-top:10px;padding:10px 22px;border:0;border-radius:12px;background:var(--gold);font-weight:700;color:#3e2400}
#box .row{display:flex;justify-content:space-between;gap:10px}
</style>

try{var r=localStorage.getItem("dubli_save");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
var $=function(i){return document.getElementById(i)},game=$("game"),hero=$("hero");
function click(){return Math.round((1+S.lv*0.2)*10)/10}
function cost(){return Math.round(50*Math.pow(1.35,S.lv))}
function hcost(){return Math.round(300*Math.pow(1.6,S.helper))}
function save(){try{localStorage.setItem("dubli_save",JSON.stringify(S))}catch(e){}}
function fmt(x){return Math.floor(x).toLocaleString("ru-RU")}
function ui(){$("n").textContent=fmt(S.m);$("cv").textContent=click();
  var done=S.lv>=MAX;$("cost").textContent=done?"—":fmt(cost());
  $("pct").textContent="+20% ("+S.lv+"/"+MAX+")";$("up").disabled=done||S.m<cost()}
// sound
var ctx,buf,pool=[];
function initAudio(){if(ctx)return;try{var AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();
  var b=atob(SND.split(",")[1]),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  ctx.decodeAudioData(u.buffer,function(d){buf=d},function(){ctx=null})}catch(e){ctx=null}}
function play(){
  if(ctx&&buf){if(ctx.state==="suspended")ctx.resume();var s=ctx.createBufferSource();s.buffer=buf;s.connect(ctx.destination);s.start(0);return}
  try{var a=new Audio(SND);a.play()}catch(e){}}
function float(x,y,t){var f=document.createElement("div");f.className="fl";f.textContent=t;
  var R=game.getBoundingClientRect();f.style.left=(x-R.left-12)+"px";f.style.top=(y-R.top-20)+"px";game.appendChild(f);setTimeout(function(){f.remove()},900)}
function bubble(){var b=document.createElement("div"),s=8+Math.random()*14;b.className="bub";
  b.style.cssText="width:"+s+"px;height:"+s+"px;left:"+Math.random()*100+"%;animation-duration:"+(6+Math.random()*6)+"s";
  game.appendChild(b);setTimeout(function(){b.remove()},12000)}
setInterval(bubble,900);
function tap(e){e.preventDefault();initAudio();var p=e.touches?e.touches[0]:e;
  var v=click();S.m+=v;S.total+=v;S.clicks++;play();
  float(p.clientX+(Math.random()*30-15),p.clientY,"+"+v);
  hero.classList.remove("hit");void hero.offsetWidth;hero.classList.add("hit");
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
  ui()}
hero.addEventListener("pointerdown",tap);
$("up").onclick=function(){if(S.lv<MAX&&S.m>=cost()){S.m-=cost();S.lv++;save();ui()}};
function modal(h){$("box").innerHTML=h+'<br><button id="cl">Закрыть</button>';$("modal").classList.add("on");$("cl").onclick=function(){$("modal").classList.remove("on")}}
$("b1").onclick=function(){modal("<b>Статистика</b><div class='row'><span>Кликов</span><b>"+fmt(S.clicks)+"</b></div><div class='row'><span>Заработано</span><b>"+fmt(S.total)+"</b></div><div class='row'><span>Уровень клика</span><b>"+S.lv+"/"+MAX+"</b></div><div class='row'><span>Помощников</span><b>"+S.helper+"</b></div>")};
$("b2").onclick=function(){var c=hcost();modal("<b>Помощник</b><br>Приносит +1 голду в секунду.<br>У вас: "+S.helper+"<br><button id='bh'>Нанять за "+fmt(c)+"</button>");
  $("bh").onclick=function(){if(S.m>=c){S.m-=c;S.helper++;save();ui();$("b2").click()}}};
setInterval(function(){if(S.helper){S.m+=S.helper;S.total+=S.helper;ui()}},1000);
setInterval(save,5000);
ui();
})();
